name: Build desktop client

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: xyzw-game-client-windows
          path: release/*.exe
          if-no-files-found: error

  macos:
    name: macOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: xyzw-game-client-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - windows
      - macos
    # A manual run is useful for testing builds; a pushed version tag publishes.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xyzw-game-client-windows
          path: release-assets/windows
      - uses: actions/download-artifact@v4
        with:
          name: xyzw-game-client-macos
          path: release-assets/macos
      - name: Create release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/windows/* release-assets/macos/* \
            --title "XYZW Game Client $TAG" \
            --generate-notes
